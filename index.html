<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽個塔羅牌，解決你心中的疑惑</title>
  <style>
    :root {
      --sky1: #cfe8f7; --sky2: #eef7fb;
      --grass: #7cae6a; --grass-deep: #4f8a4b; --grass-pale: #dcecc9;
      --ink: #2f4a3c; --muted: #6f8a7a; --sky-deep: #4f8fb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans JP", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-weight: 300;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, #f6faee 100%);
      background-attachment: fixed;
      min-height: 100vh;
      position: relative;
    }
    /* 底部的草原丘陵 */
    body::after {
      content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 100% at 18% 100%, #c5e0ac 0 60%, transparent 61%),
        radial-gradient(70% 90% at 80% 100%, #b4d79a 0 60%, transparent 61%),
        radial-gradient(90% 60% at 50% 100%, #a3cb88 0 60%, transparent 61%);
      opacity: .85;
    }
    .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 48px 16px 120px; text-align: center; }
    h1 {
      margin: 0; font-size: clamp(22px, 5vw, 34px); font-weight: 400; letter-spacing: .12em;
      color: var(--ink); line-height: 1.5;
    }
    .sub { margin: 10px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .2em; }
    .divider { margin: 20px auto 32px; width: 48px; height: 2px; border-radius: 2px; background: var(--grass); }

    .spread {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 18px 14px; min-height: 260px; perspective: 1200px;
    }
    .slot { width: clamp(88px, 17vw, 150px); }
    .card { position: relative; aspect-ratio: 3 / 5; }
    .card-inner {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.2,.7,.2,1);
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      box-shadow: 0 6px 18px rgba(60,100,80,.22), 0 0 0 1px rgba(255,255,255,.8);
    }
    .back {
      background: linear-gradient(180deg, #9fcbe6, #bfe0c2);
      border: 6px solid #fff;
      display: grid; place-items: center;
    }
    .back svg { width: 62%; height: auto; display: block; opacity: .95; }
    .front { transform: rotateY(180deg); background: #fff; }
    .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .front img.reversed, .fallback.reversed { transform: rotate(180deg); }
    .fallback {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 18px; color: var(--ink); padding: 6px;
    }

    .label { margin-top: 10px; min-height: 44px; opacity: 0; transition: opacity .5s .4s; }
    .card.flipped + .label { opacity: 1; }
    .label .name { font-size: 15px; font-weight: 400; letter-spacing: .08em; }
    .label .ori {
      display: inline-block; margin-top: 4px; padding: 1px 10px; font-size: 12px;
      border-radius: 999px; border: 1px solid var(--grass); color: var(--grass-deep); background: rgba(255,255,255,.6);
    }
    .label .ori.rev { border-color: var(--sky-deep); color: var(--sky-deep); }

    .hint { color: var(--muted); font-size: 14px; align-self: center; padding: 70px 0; letter-spacing: .1em; }

    .draw-button {
      margin-top: 34px; padding: 13px 44px; font-size: 16px; letter-spacing: .25em;
      font-family: inherit; color: #fff; cursor: pointer; border: none; border-radius: 999px;
      background: var(--grass-deep);
      box-shadow: 0 6px 16px rgba(79,138,75,.28);
      transition: transform .15s, box-shadow .15s, opacity .2s, background .2s;
    }
    .draw-button:hover:not(:disabled) { transform: translateY(-2px); background: #437d40; box-shadow: 0 10px 22px rgba(79,138,75,.35); }
    .draw-button:disabled { opacity: .5; cursor: default; }
    .foot { margin-top: 40px; font-size: 12px; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      .card-inner, .label { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>抽個塔羅牌，解決你心中的疑惑</h1>
    <p class="sub">靜下心，想著你的問題</p>
    <div class="divider"></div>

    <div id="tarot-display-area" class="spread" aria-live="polite">
      <p class="hint">準備好了，就按下「抽牌」</p>
    </div>

    <button id="draw-button" class="draw-button" type="button">抽牌</button>
    <p class="foot">Rider-Waite 牌面（公有領域）・牌背字形 pona 取自 sitelen seli kiwen（OFL）</p>
  </main>

  <script>
    'use strict';

    const TAROT_CARDS = [
      "杖王", "杖后", "杖騎", "杖公主", "杖１", "杖２", "杖３", "杖４", "杖５", "杖６", "杖７", "杖８", "杖９", "杖10",
      "劍王", "劍后", "劍騎", "劍公主", "劍１", "劍２", "劍３", "劍４", "劍５", "劍６", "劍７", "劍８", "劍９", "劍10",
      "杯王", "杯后", "杯騎", "杯公主", "杯１", "杯２", "杯３", "杯４", "杯５", "杯６", "杯７", "杯８", "杯９", "杯10",
      "錢王", "錢后", "錢騎", "錢公主", "錢１", "錢２", "錢３", "錢４", "錢５", "錢６", "錢７", "錢８", "錢９", "錢10",
      "魔術師", "女教皇", "女皇", "皇帝", "教宗", "戀人", "戰車", "正義", "隱者", "命輪",
      "力量", "吊人", "死神", "節制", "惡魔", "高塔", "星星", "月亮", "太陽", "審判", "世界", "愚者"
    ];

    const NUM_CARDS_TO_DRAW = 5;
    const IMAGE_BASE_URL = "images/tarot/"; // 0.jpg ~ 77.jpg
    const FLIP_DELAY = 450;                 // 每張牌翻開的間隔（毫秒）

    // 牌背：Toki Pona 象形字 pona（取自 sitelen seli kiwen 字型，SIL OFL 1.1，Kreative Software）
    const PONA_SVG = '<svg viewBox="11 -535 703 371" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="scale(1,-1)"><path fill="#fff" d="M576 435Q576 477 620 477Q654 477 654 453Q654 449 653.0 440.0Q652 431 645.5 407.5Q639 384 628.0 361.0Q617 338 593.0 307.5Q569 277 537 252Q530 246 480.5 227.0Q431 208 423 208Q416 208 390.0 206.0Q364 204 353 204Q318 204 286.0 214.0Q254 224 233.5 234.5Q213 245 207.0 245.0Q201 245 201 250Q201 254 182.0 273.0Q163 292 158 292Q154 292 132.5 323.0Q111 354 111 360Q111 364 106.0 369.5Q101 375 97 389Q94 399 82.5 426.0Q71 453 71 460Q71 464 78.0 479.5Q85 495 92 495Q95 495 100 489Q103 486 105.0 487.0Q107 488 111.0 490.0Q115 492 118 492Q133 492 138 462Q140 447 157.0 411.5Q174 376 187 358Q206 332 223.5 319.0Q241 306 294 280Q326 265 367 265Q448 265 506 311Q530 329 539 335Q546 340 555.5 365.0Q565 390 570.5 411.5Q576 433 576 435Z"/></g></svg>';

    const button = document.getElementById("draw-button");
    const displayArea = document.getElementById("tarot-display-area");

    function shuffledIndices() {
      const a = Array.from({ length: TAROT_CARDS.length }, (_, k) => k);
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildCard(cardIndex, isReversed) {
      const name = TAROT_CARDS[cardIndex];

      const slot = document.createElement("div");
      slot.className = "slot";

      const card = document.createElement("div");
      card.className = "card";
      const inner = document.createElement("div");
      inner.className = "card-inner";

      const back = document.createElement("div");
      back.className = "face back";
      back.innerHTML = PONA_SVG;

      const front = document.createElement("div");
      front.className = "face front";
      const img = document.createElement("img");
      img.src = `${IMAGE_BASE_URL}${cardIndex}.jpg`;
      img.alt = name;
      if (isReversed) img.classList.add("reversed");
      img.onerror = function () {
        const fb = document.createElement("div");
        fb.className = "fallback" + (isReversed ? " reversed" : "");
        fb.textContent = name;
        this.replaceWith(fb);
      };
      front.appendChild(img);

      inner.append(back, front);
      card.appendChild(inner);

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `<div class="name"></div><span class="ori ${isReversed ? "rev" : ""}">${isReversed ? "逆位" : "正位"}</span>`;
      label.querySelector(".name").textContent = name;

      slot.append(card, label);
      return card;
    }

    function drawAndDisplayTarot() {
      button.disabled = true;
      displayArea.innerHTML = "";

      const cards = shuffledIndices().slice(0, NUM_CARDS_TO_DRAW).map((idx) => {
        const card = buildCard(idx, Math.random() < 0.5);
        displayArea.appendChild(card.parentElement);
        return card;
      });

      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add("flipped"), 400 + i * FLIP_DELAY);
      });
      setTimeout(() => {
        button.disabled = false;
        button.textContent = "重新抽牌";
      }, 400 + cards.length * FLIP_DELAY + 600);
    }

    button.addEventListener("click", drawAndDisplayTarot);
  </script>
</body>
</html>
