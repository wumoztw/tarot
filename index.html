<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塔羅牌抽牌</title>
  <style>
    :root {
      --bg1: #1b1033; --bg2: #0b0719;
      --gold: #e6c36a; --gold-soft: #b99a4a;
      --text: #efe8ff; --muted: #a79dc4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, #3b2670 0%, transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 40px 16px 56px; text-align: center; }
    h1 {
      margin: 0; font-size: clamp(28px, 6vw, 44px); letter-spacing: .3em;
      color: var(--gold); text-shadow: 0 0 18px rgba(230,195,106,.35);
    }
    .sub { margin: 10px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .15em; }
    .divider { margin: 18px auto 30px; width: 160px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent); }

    .spread {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 18px 14px; min-height: 260px; perspective: 1200px;
    }
    .slot { width: clamp(88px, 17vw, 150px); }
    .card { position: relative; aspect-ratio: 3 / 5; }
    .card-inner {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.2,.7,.2,1);
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; border-radius: 8px; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(230,195,106,.35);
    }
    .back {
      background:
        radial-gradient(circle at 50% 50%, rgba(230,195,106,.35) 0 6%, transparent 7%),
        repeating-conic-gradient(from 0deg at 50% 50%, #3a2477 0 10deg, #2a1857 10deg 20deg);
      border: 3px solid var(--gold-soft);
    }
    .back::after {
      content: "✦"; position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 34px; color: var(--gold); text-shadow: 0 0 12px rgba(230,195,106,.7);
    }
    .front { transform: rotateY(180deg); background: #2a1857; }
    .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .front img.reversed, .fallback.reversed { transform: rotate(180deg); }
    .fallback {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-size: 18px; color: var(--gold); padding: 6px;
    }

    .label { margin-top: 10px; min-height: 44px; opacity: 0; transition: opacity .5s .4s; }
    .card.flipped + .label { opacity: 1; }
    .label .name { font-size: 15px; letter-spacing: .08em; }
    .label .ori {
      display: inline-block; margin-top: 4px; padding: 1px 10px; font-size: 12px;
      border-radius: 999px; border: 1px solid var(--gold-soft); color: var(--gold);
    }
    .label .ori.rev { border-color: #d98aa0; color: #f0a9bd; }

    .hint { color: var(--muted); font-size: 14px; align-self: center; padding: 70px 0; }

    .draw-button {
      margin-top: 34px; padding: 13px 44px; font-size: 17px; letter-spacing: .25em;
      font-family: inherit; color: #1b1033; cursor: pointer; border: none; border-radius: 999px;
      background: linear-gradient(180deg, #f3d98b, var(--gold-soft));
      box-shadow: 0 6px 20px rgba(230,195,106,.3);
      transition: transform .15s, box-shadow .15s, opacity .2s;
    }
    .draw-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(230,195,106,.45); }
    .draw-button:disabled { opacity: .55; cursor: default; }
    .foot { margin-top: 40px; font-size: 12px; color: #6f6590; }

    @media (prefers-reduced-motion: reduce) {
      .card-inner, .label { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>塔羅牌抽牌</h1>
    <p class="sub">靜下心，想著你的問題</p>
    <div class="divider"></div>

    <div id="tarot-display-area" class="spread" aria-live="polite">
      <p class="hint">準備好了，就按下「抽牌」</p>
    </div>

    <button id="draw-button" class="draw-button" type="button">抽牌</button>
    <p class="foot">Rider-Waite 牌面（公有領域）</p>
  </main>

  <script>
    'use strict';

    const TAROT_CARDS = [
      "杖王", "杖后", "杖騎", "杖公主", "杖１", "杖２", "杖３", "杖４", "杖５", "杖６", "杖７", "杖８", "杖９", "杖10",
      "劍王", "劍后", "劍騎", "劍公主", "劍１", "劍２", "劍３", "劍４", "劍５", "劍６", "劍７", "劍８", "劍９", "劍10",
      "杯王", "杯后", "杯騎", "杯公主", "杯１", "杯２", "杯３", "杯４", "杯５", "杯６", "杯７", "杯８", "杯９", "杯10",
      "錢王", "錢后", "錢騎", "錢公主", "錢１", "錢２", "錢３", "錢４", "錢５", "錢６", "錢７", "錢８", "錢９", "錢10",
      "魔術師", "女教皇", "女皇", "皇帝", "教宗", "戀人", "戰車", "正義", "隱者", "命輪",
      "力量", "吊人", "死神", "節制", "惡魔", "高塔", "星星", "月亮", "太陽", "審判", "世界", "愚者"
    ];

    const NUM_CARDS_TO_DRAW = 5;
    const IMAGE_BASE_URL = "images/tarot/"; // 0.jpg ~ 77.jpg
    const FLIP_DELAY = 450;                 // 每張牌翻開的間隔（毫秒）

    const button = document.getElementById("draw-button");
    const displayArea = document.getElementById("tarot-display-area");

    function shuffledIndices() {
      const a = Array.from({ length: TAROT_CARDS.length }, (_, k) => k);
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildCard(cardIndex, isReversed) {
      const name = TAROT_CARDS[cardIndex];

      const slot = document.createElement("div");
      slot.className = "slot";

      const card = document.createElement("div");
      card.className = "card";
      const inner = document.createElement("div");
      inner.className = "card-inner";

      const back = document.createElement("div");
      back.className = "face back";

      const front = document.createElement("div");
      front.className = "face front";
      const img = document.createElement("img");
      img.src = `${IMAGE_BASE_URL}${cardIndex}.jpg`;
      img.alt = name;
      if (isReversed) img.classList.add("reversed");
      img.onerror = function () {
        const fb = document.createElement("div");
        fb.className = "fallback" + (isReversed ? " reversed" : "");
        fb.textContent = name;
        this.replaceWith(fb);
      };
      front.appendChild(img);

      inner.append(back, front);
      card.appendChild(inner);

      const label = document.createElement("div");
      label.className = "label";
      label.innerHTML = `<div class="name"></div><span class="ori ${isReversed ? "rev" : ""}">${isReversed ? "逆位" : "正位"}</span>`;
      label.querySelector(".name").textContent = name;

      slot.append(card, label);
      return card;
    }

    function drawAndDisplayTarot() {
      button.disabled = true;
      displayArea.innerHTML = "";

      const cards = shuffledIndices().slice(0, NUM_CARDS_TO_DRAW).map((idx) => {
        const card = buildCard(idx, Math.random() < 0.5);
        displayArea.appendChild(card.parentElement);
        return card;
      });

      cards.forEach((card, i) => {
        setTimeout(() => card.classList.add("flipped"), 400 + i * FLIP_DELAY);
      });
      setTimeout(() => {
        button.disabled = false;
        button.textContent = "重新抽牌";
      }, 400 + cards.length * FLIP_DELAY + 600);
    }

    button.addEventListener("click", drawAndDisplayTarot);
  </script>
</body>
</html>
